services:
  builder:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: kde-linux-builder
    # Resource limits
    #cpus: 2.0
    #mem_limit: 4g
    #memswap_limit: 8g
    #pids_limit: 256

    privileged: true

    devices:
      - "/dev/loop-control:/dev/loop-control"

    volumes:
      - "/dev:/dev"
      - "/sys:/sys:ro"
      - "./.env:/workspace/.env:ro"
      - build_source:/workspace/src-${TARGET_BRANCH}
      - build_artifacts:/workspace/output
      - build_state:/state
      - build_gnupg:/gnupg
      - "${GPG_EXPORT_DIR}:/key-export:rw"

    environment:
      GITHUB_USERNAME: ${GITHUB_USERNAME}
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      FORK_REPO: ${FORK_REPO}
      UPSTREAM_REPO: ${UPSTREAM_REPO}
      TARGET_BRANCH: ${TARGET_BRANCH}
      UPSTREAM_BRANCH: ${UPSTREAM_BRANCH}
      POLL_INTERVAL: ${POLL_INTERVAL}

    restart: unless-stopped

  webserver:
    image: docker.io/library/caddy:alpine
    container_name: kde-linux-webserver
    ports:
      - "8485:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - build_artifacts:/srv/artifacts:ro
    restart: unless-stopped

volumes:
  build_source:
  build_artifacts:
  build_state:
  build_gnupg:
